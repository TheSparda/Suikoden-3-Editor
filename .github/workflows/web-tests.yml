name: web-tests

# Validation of the web editor: fast browser-free checks (JS syntax, ISO offset bounds,
# reference-table parsing, description merge, VCDIFF encoder, app-shell wiring) plus the full
# Playwright e2e suite against a synthetic in-bounds ISO — including planted-byte assertions
# that the verified table offsets (skill-max +16, growth HP@+0, rune Head/Right/Left) still
# decode correctly (see web/tests/synth-iso.mjs / e2e.mjs).
# push-only: PRs come from branches in this same repo, so a pull_request trigger
# just re-runs the suite on the synthetic merge ref — a duplicate of the push run
# that has produced spurious "PR run failed" noise (e.g. runs 99/103 red while the
# push runs 98/102 on the identical commits were green).
on:
  push:
    paths: ["web/**", "Editor/**", "tools/**", ".github/workflows/web-tests.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate web editor
        run: node web/tests/validate.mjs
      - name: Recruit-core unit tests
        run: node web/tests/recruit-logic.mjs
      - name: Rename-core unit tests
        run: node web/tests/rename-core.mjs
      - name: Guide-core unit tests (guide-overlay name join + coverage)
        run: node web/tests/guide-core.mjs
      - name: Text-core unit tests (in-ELF string scanner + prose filter)
        run: node web/tests/text-core.mjs
      - name: Save round-trip (synthetic gamedata)
        run: node web/tests/save-roundtrip.mjs
      # The decoder's real coverage is against genuine xdelta3 output; without the binary those
      # checks self-skip and the patch-apply path would ride into a release untested.
      - name: Install xdelta3 (real-patch decode coverage)
        run: sudo apt-get install -y xdelta3
      - name: VCDIFF (.xdelta) encoder + decoder tests
        run: node web/tests/vcdiff.mjs
      - name: Description-merge tests (rune/food/skill)
        run: node web/tests/desc-merge.mjs
      # The emulator half (boot-verify) needs a disc and a PS2 BIOS and cannot run here;
      # this covers everything under it — PINE framing against a mock server, savestate
      # parsing, scan narrowing, ELF calibration, PNG hashing. Pure stdlib, no install.
      - name: PCSX2 harness self-test (no emulator required)
        run: python3 tools/pcsx2/selftest.py

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install xdelta3 (the apply-patch e2e builds real patches with it)
        run: sudo apt-get install -y xdelta3
      - name: Install e2e deps
        run: npm install
        working-directory: web/tests
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: web/tests
      - name: Playwright e2e (ISO editor + verified-offset fixture)
        run: node e2e.mjs
        working-directory: web/tests
